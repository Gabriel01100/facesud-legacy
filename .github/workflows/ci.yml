name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: facesud
          POSTGRES_USER: facesud
          POSTGRES_PASSWORD: facesud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facesud -d facesud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"
      - name: Lint backend
        working-directory: apps/api
        run: ruff check app tests migrations
      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://facesud:facesud_ci@localhost:5432/facesud
        run: alembic upgrade head
      - name: Create isolated identity test database
        env:
          PGPASSWORD: facesud_ci
        run: createdb -h localhost -U facesud facesud_identity_test
      - name: Run API tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://facesud:facesud_ci@localhost:5432/facesud
          IDENTITY_TEST_DATABASE_URL: postgresql+psycopg://facesud:facesud_ci@localhost:5432/facesud_identity_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Bootstrap and commit npm lockfile once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/identity-hardening'
        working-directory: apps/web
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked; nothing to bootstrap."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(web): add reproducible npm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Export generated npm lockfile for bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: facesud-web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
